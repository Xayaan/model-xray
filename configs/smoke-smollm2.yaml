# Local end-to-end check on a laptop CPU (~10 minutes): SmolLM2-135M, 3 MLP transcoders.
name: smoke-smollm2
model:
  name: HuggingFaceTB/SmolLM2-135M
  dtype: float32
  device: cpu
data:
  sources:
    - {hf: Salesforce/wikitext, name: wikitext-103-raw-v1, split: train, text_field: text}
  eval_sources:
    - {hf: Salesforce/wikitext, name: wikitext-103-raw-v1, split: validation, text_field: text}
  ctx_len: 256
  batch_size: 8
  shuffle_buffer: 1000
dictionary:
  kind: transcoder
  expansion: 8
  k: 32
  dead_after_tokens: 1000000
train:
  sites: ["mlp:evenly3"]
  total_tokens: 1500000
  train_batch: 2048
  warmup_steps: 50
  log_every: 50
  save_every_tokens: 100000000
eval:
  n_tokens: 30000
  batch_size: 4
analysis:
  n_tokens: 300000
  top_examples: 10
