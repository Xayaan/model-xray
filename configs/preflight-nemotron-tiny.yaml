# Two-minute rehearsal of the whole pilot on a tiny randomly initialised Nemotron-H: same data
# sources, chat template, Mamba kernels and findings code, so environment problems surface before
# the long run starts paying for GPU time.
name: preflight-nemotron-tiny
model:
  name: nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
  dtype: bfloat16
  random_init:
    hidden_size: 256
    intermediate_size: 512
    num_attention_heads: 4
    num_key_value_heads: 2
    head_dim: 64
    mamba_num_heads: 8
    mamba_head_dim: 64
    n_groups: 2
    ssm_state_size: 64
    time_step_rank: 16
    chunk_size: 64
    num_hidden_layers: 6
    layers_block_type: [linear_attention, mlp, linear_attention, full_attention, mlp, linear_attention]
data:
  sources:
    - {hf: HuggingFaceFW/fineweb-edu, name: sample-10BT, split: train, text_field: text, weight: 0.8}
    - {hf: HuggingFaceH4/ultrachat_200k, split: train_sft, chat_field: messages, weight: 0.2}
  eval_sources:
    - {hf: HuggingFaceFW/fineweb, name: sample-10BT, split: train, text_field: text, weight: 0.8}
    - {hf: HuggingFaceH4/ultrachat_200k, split: test_sft, chat_field: messages, weight: 0.2}
  ctx_len: 256
  batch_size: 4
  shuffle_buffer: 100
dictionary:
  kind: transcoder
  expansion: 2
  k: 8
train:
  sites: ["mlp:all"]
  total_tokens: 20000
  train_batch: 512
  buffer_batches: 2
  warmup_steps: 5
  log_every: 10
eval:
  n_tokens: 2000
  batch_size: 2
analysis:
  n_tokens: 4000
  top_examples: 3
  window_left: 4
  window_right: 2
  chunk_size: 64
